name: Publish to npm

# Merge-to-main IS the release authorization: every push to main publishes
# the next 0.0.x patch, commits the bump back with [skip ci], and tags.
# Manual dispatch remains for exact-version releases. The loop guard is the
# registry itself: when package.json's version already exists on npm the run
# succeeds without publishing (this is what makes the bump commit's own
# re-trigger a no-op even if [skip ci] were ignored).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (0.0.x) — must match package.json
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Refuse to publish past a red Tests suite
        # Merge-to-main is the release authorization, but the release must not
        # outrun the regression net added in tests.yml: wait for the Tests run
        # of this exact commit and publish only on success. A red (or absent)
        # suite fails this step, so a regression can never ride a merge out.
        # Dispatch releases skip the gate — dispatch is already a deliberate
        # human action on a commit that passed its own push's Tests run.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEADLINE=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            RESP=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?event=push&head_sha=${GITHUB_SHA}&per_page=100" || true)
            # The API may return path with an @ref suffix (tests.yml@main);
            # strip it before matching so the gate can never miss the run.
            RUN=$(printf '%s' "$RESP" | jq -r '[.workflow_runs[]? | select(((.path // "") | sub("@.*$"; "")) == ".github/workflows/tests.yml")][0] // empty' 2>/dev/null || true)
            if [ -n "$RUN" ]; then
              STATUS=$(printf '%s' "$RUN" | jq -r .status)
              if [ "$STATUS" = "completed" ]; then
                CONCLUSION=$(printf '%s' "$RUN" | jq -r .conclusion)
                if [ "$CONCLUSION" = "success" ]; then
                  echo "Tests suite green on $GITHUB_SHA — proceeding."
                  exit 0
                fi
                echo "Tests suite concluded: $CONCLUSION — refusing to publish."
                exit 1
              fi
              echo "Tests suite $STATUS on $GITHUB_SHA — waiting…"
            else
              echo "No Tests run for $GITHUB_SHA yet — waiting…"
            fi
            sleep 20
          done
          echo "Timed out waiting for the Tests suite on $GITHUB_SHA — refusing to publish."
          exit 1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          # Same pin as tests.yml: releases must build under the Bun the
          # bundle's grammar and suite were verified against, not whatever
          # setup-bun floats on merge day.
          bun-version: "1.4.3"
      - name: Resolve the release version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          HEAD_SUBJECT=$(git log -1 --pretty=%s)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$DISPATCH_VERSION" ]; then
            if [ "$CURRENT" != "$DISPATCH_VERSION" ]; then
              echo "dispatch requested $DISPATCH_VERSION but package.json is $CURRENT"; exit 1
            fi
            VERSION="$CURRENT"
          elif printf '%s' "$HEAD_SUBJECT" | grep -q '^chore(release): v'; then
            # This push IS the release-bot's bump commit — the release it
            # belongs to already happened in the run that created it.
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "head is release commit: $HEAD_SUBJECT"
            exit 0
          else
            # Every other push to main releases the next patch. The registry
            # check stays as a re-run guard: publishing an existing version
            # would fail, so skip instead.
            VERSION=$(node -p "'$CURRENT'.split('.').map((p, i) => i === 2 ? +p + 1 : p).join('.')")
            if npm view "plugnz@$VERSION" version >/dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "$VERSION already exists on npm — skipping re-run"
              exit 0
            fi
            node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.version = '$VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')"
            bun install --frozen-lockfile
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build the release bundle at the release version
        if: steps.version.outputs.skip != 'true'
        run: |
          bun install --frozen-lockfile
          bun run build
          # The bundle embeds package.json's version; building must happen
          # after the bump or the artifact ships the previous version.
          test "$(node dist/plugnz.mjs --version --json)" = "{\"name\":\"plugnz\",\"version\":\"$RELEASE_VERSION\"}"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
      - name: Publish, tag, and commit the bump
        if: steps.version.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm install --global npm@11.14.1
          npm publish --access public --ignore-scripts
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v$RELEASE_VERSION [skip ci]"
          git tag "v$RELEASE_VERSION"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main "v$RELEASE_VERSION"
