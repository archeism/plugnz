name: Tests

# The suite never ran in CI: publish runs build+smoke, node-compat runs build+gates,
# CodeQL is static. This is the missing regression net (and the clean-environment
# tiebreaker for locally-flaky suites).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          # Pin to the version the yaml-parity grammar was re-swept under
          # (test/yaml-parity.test.ts GRAMMAR_VERIFIED_BUN). Unpinned setup-bun
          # floated 1.4.3 onto a writer swept under 1.4.2 and reddened CI.
          bun-version: "1.4.3"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install and run the full suite
        run: |
          bun install --frozen-lockfile
          bun test
      # No separate typecheck here: node-compat.yml already typechecks every
      # PR and push in its matrix; this job is the suite net only.
